name: wifi_ftp_server
description: "A production-ready WiFi FTP Server Android application built with Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking / device info
  network_info_plus: ^6.0.1
  connectivity_plus: ^6.0.5

  # Permissions
  permission_handler: ^11.3.1

  # Foreground service + notifications
  flutter_foreground_task: ^8.10.4

  # Storage & paths
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  path: ^1.9.0

  # QR + sharing + clipboard utilities
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2

  # Formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
